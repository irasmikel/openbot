name: Scout (rojas tempranas)

on:
  schedule:
    # Una ejecución vigila TODO el día y se relanza sola cada ~5h40 si quedan partidos.
    # Varias horas de arranque por si GitHub se salta alguna (si ya hay una en marcha, esperan en cola).
    - cron: "7 9 * * *"
    - cron: "37 11,13,15,17,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        options: [watch, diagnose, test-alert]
        default: diagnose

concurrency:
  group: scout
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL || 'https://api.z.ai/api/paas/v4' }}
          OPENAI_COMPAT_MODEL: ${{ vars.OPENAI_COMPAT_MODEL || 'glm-4.5-flash,glm-4.7-flash' }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
        run: python -m futbot ${{ inputs.mode || 'watch' }}
      - name: Guardar registro de alertas
        if: always()
        run: |
          git config user.name "futbot"
          git config user.email "futbot@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "data: registro $(date -u +%F_%H%M)"
            git pull --rebase --autostash && git push
          fi
